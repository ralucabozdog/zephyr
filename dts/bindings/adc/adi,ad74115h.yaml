description: |
  Analog Devices AD74115H single-channel software configurable input/output

  The channel is configured for voltage input. ADC channel 0 is the primary
  ADC conversion and measures 0 V to 12 V with 16-bit resolution, so its
  channel node uses zephyr,reference = "ADC_REF_INTERNAL",
  zephyr,vref-mv = <12000> and zephyr,resolution = <16>.

  The device samples on the falling SCLK edge; select the matching SPI
  mode with the spi-cpol and spi-cpha properties.

compatible: "adi,ad74115h"

include: [adc-controller.yaml, spi-device.yaml]

on-bus: spi

properties:
  "#io-channel-cells":
    const: 1

  reset-gpios:
    type: phandle-array
    description: |
      GPIO connected to the active-low RESET pin. A software reset is used
      when this property is not present.

io-channel-cells:
  - input
